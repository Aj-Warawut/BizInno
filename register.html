:root{--ink:#1F2A37;--muted:#5C6B7A;--line:#DDE3EA;--bg:#F3F5F8;--card:#fff;--accent:#1F4E8C;--soft:#EAF1FA;--ok:#1F7A5A;--okbg:#E6F5EE;--wait:#8A5A00;--waitbg:#FBF3DF}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px}
a{color:var(--accent)}
.top{background:linear-gradient(135deg,#14284d,#1F4E8C);color:#fff}
.top .in{max-width:960px;margin:0 auto;padding:22px 16px 18px;position:relative}
.top h1{font-size:25px;margin:0 0 2px;line-height:1.3}.top p{margin:0;color:#D5E1F5;font-size:15px}

.seg{display:flex;flex-wrap:wrap;gap:6px}

.course .nm{flex:1 1 280px}.course .nm small{display:block;color:var(--muted)}
.cr{font-weight:800;color:var(--accent);white-space:nowrap}
.tag{display:inline-block;border-radius:20px;padding:0 8px;font-size:12px;font-weight:700;margin-left:4px;vertical-align:1px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.wait{background:var(--waitbg);color:var(--wait)}
.btn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:20px;padding:5px 12px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent);color:#fff}
.sub{color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;font-size:13px;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);background:#FAFBFC}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.tba{color:var(--wait);font-weight:700}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:8px}details>summary{cursor:pointer;font-weight:700;padding:8px 0}details[open]{padding-bottom:10px}

.dlg{position:fixed;inset:0;background:rgba(20,40,77,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.dlg.on{display:flex}
.dlg .in{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:16px 18px;position:relative}

.x{position:absolute;right:12px;top:10px;border:0;background:var(--soft);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
ol,ul{margin:4px 0;padding-left:22px}li{margin:3px 0}
footer{max-width:960px;margin:0 auto;padding:4px 16px 24px;color:var(--muted);font-size:13px}
@media(max-width:700px){.pick{grid-template-columns:minmax(0,1fr)}.top h1{font-size:21px;margin-right:84px}}
@media print{.lang,.btn,.pick{display:none!important}body{background:#fff}}
</style>

  const here=CRS.filter(c=>c.level===P),byCode=Object.fromEntries(here.map(c=>[c.code,c])),elec=here.filter(c=>/เลือก/.test(c.category));
  const nm=c=>L==="en"&&c.nameEn?c.nameEn:c.nameTh;
  const row=(code,name,cr,c)=>'<div class="course"><div class="nm"><b>'+esc(code.slice(0,4)+" "+code.slice(4))+"</b> "+esc(c?nm(c):L==="en"?name.replace("วิทยานิพนธ์","Thesis").replace("การค้นคว้าอิสระ","Independent Study"):name)+(c?'<span class="tag ok">'+esc(t("open"))+"</span>":isTh(name)?'<span class="tag ok">'+esc(t("thesis"))+"</span><small>"+esc(t("thFor",{e:span(cohOf(code,K))||"–"}))+(ruleFor(K)?" · <b>"+esc(ruleFor(K))+"</b>":"")+"</small>":'<span class="tag wait">'+esc(t("notopen"))+"</span>")+(c&&L==="th"&&c.nameEn?"<small>"+esc(c.nameEn)+"</small>":"")+'</div><span class="cr">'+cr+" "+esc(t("cr"))+"</span>"+(c?'<button class="btn" data-c="'+c.code+'">'+esc(t("detail"))+"</button>":"")+"</div>";
  let h="";
  const ent=ENT.find(x=>x[0]===E),n=ent?ent[3]:N+1,ord=ent?ordOf(ent):99;if(n>N){h='<div class="head"><b>'+esc(t("you",{t:D.term.label}))+"</b></div><div class='note'>"+esc(t("over"))+"</div>";}
  else{const s=pl.slots[n-1],items=s[2][K]||[];let miss=false,tot=0;
    h='<div class="head"><b>'+esc(t("you",{t:D.term.label}))+'</b><span class="sub">'+esc(t("entered",{e:E}))+" · "+esc(t("sem",{n,s:L==="en"?SLOT_EN(s[1]):s[1]}))+" · "+esc(TRK(pl.tracks[K]))+"</span></div>";
    let rng=false;items.map(x=>{const r=isTh(x.name)?ruleOf(K):null,o=r&&r.credits&&r.credits[ord];if(r&&r.maxCr&&ord>=(r.from||1)&&r.maxCr>x.cr)return{...x,cr:r.maxCr,min:x.cr,orig:x.cr,note:r.maxNote};return o?{...x,cr:o,orig:x.cr,note:r.creditsNote}:x;}).forEach(x=>{tot+=x.cr;if(x.code==="elective"){h+='<div class="course"><div class="nm"><b>'+esc(t("elective",{c:x.cr}))+"</b><small>"+esc(t("elecPick"))+"</small></div></div>"+elec.map(c=>row(c.code,c.nameTh,cnum(c),c)).join("");if(!elec.length)miss=true;}
      else if(isTh(x.name)&&!thOK(K,ord)){tot-=x.cr;const r=ruleOf(K);h+='<div class="course"><div class="nm"><b>'+esc(x.code.slice(0,4)+" "+x.code.slice(4))+"</b> "+esc(L==="en"?"Thesis / Independent Study":x.name)+'<span class="tag wait">'+esc(t("thLater"))+"</span><small>"+esc(r.exam?t("thLaterNote",{x:r.exam[L==="en"?1:0]}):t("thLaterNote0"))+'</small></div><span class="cr" style="color:var(--muted)">–</span></div>';}
      else{const c=byCode[x.code];if(!c&&!/วิทยานิพนธ์|ค้นคว้าอิสระ/.test(x.name))miss=true;h+=row(x.code,x.name,x.min?x.min+"–"+x.cr:x.cr,c);if(x.min)rng=true;if(x.orig!=null&&x.note)h=h.replace(/<\/small><\/div>(<span class="cr">[^<]*<\/span><\/div>)$/,"<br>"+esc(x.note[L==="en"?1:0])+"</small></div>$1");}});
    h+='<p style="margin:10px 0 0;text-align:right">'+esc(rng?t("totalMax"):t("total"))+' <span class="big">'+tot+"</span> "+esc(t("cr"))+"</p>";
    if(miss)h+="<div class='warn'>"+esc(t("notopenNote"))+"</div>";
    if(ent&&ent[1]===2)h+="<div class='note'>"+esc(t("late"))+"</div>";}
  h+='<p style="margin:8px 0 0"><button class="btn" id="cp">🔗 '+esc(t("link"))+'</button> <span class="sub" id="cpm"></span></p>';
  $("res").innerHTML=h;
  $("opened").innerHTML="<h2>"+esc(t("opened"))+" ("+here.length+")</h2>"+'<div class="tw"><table><thead><tr><th></th><th>'+esc(t("cr"))+"</th><th>"+esc(t("groups"))+"</th><th>"+esc(t("sched"))+"</th><th></th></tr></thead><tbody>"+
    here.map(c=>{const sc=(REG.schedule||{})[c.code];return"<tr><td><b>"+esc(c.codeFmt)+"</b> "+esc(nm(c))+"</td><td>"+cnum(c)+"</td><td>"+esc((c.groups||[]).map(GRP).join(" · "))+"</td><td>"+(sc?esc(sc):'<span class="tba">'+esc(t("tba"))+"</span>")+'</td><td><button class="btn" data-c="'+c.code+'">'+esc(t("detail"))+"</button></td></tr>";}).join("")+"</tbody></table></div>"+(()=>{const rows=[];pl.tracks.forEach((tr,k)=>{const codes=[...new Set(pl.slots.flatMap(sl=>(sl[2][k]||[]).filter(i=>isTh(i.name)).map(i=>i.code+"|"+i.name)))];codes.forEach(cn=>{const [code,name]=cn.split("|"),co=cohOf(code,k);if(co.length)rows.push([code.slice(0,4)+" "+code.slice(4)+" "+(L==="en"?name.replace("วิทยานิพนธ์","Thesis").replace("การค้นคว้าอิสระ","Independent Study"):name),TRK(tr),span(co),ruleFor(k)||t("thNone")]);});});
    return rows.length?"<h2 style='margin-top:16px'>"+esc(t("thTitle",{t:D.term.label}))+'</h2><div class="tw"><table><thead><tr><th></th><th>'+esc(t("plan"))+"</th><th>"+esc(t("thCoh"))+"</th><th>"+esc(t("thCond"))+"</th></tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>":"";})();
  $("cal").innerHTML="<h2>"+esc(t("cal"))+"</h2>"+'<div class="tw"><table><tbody>'+(REG.calendar||[]).map(r=>"<tr><td>"+esc(L==="en"?r[1]:r[0])+"</td><td>"+(r[2]?esc(r[2]):'<span class="tba">'+esc(t("tba"))+"</span>")+"</td></tr>").join("")+"</tbody></table></div>"+
    '<p class="sub" style="margin:8px 0 0">'+[REG.calUrl?'<a href="'+esc(REG.calUrl)+'" target="_blank" rel="noopener">'+esc(t("calLink"))+"</a>":esc(t("calLink"))+": "+esc(t("tba")),REG.regUrl?'<a href="'+esc(REG.regUrl)+'" target="_blank" rel="noopener">'+esc(t("regLink"))+"</a>":esc(t("regLink"))+": "+esc(t("tba"))].join(" · ")+"</p>";
  const A=D.appeal,w=A&&A.steps&&A.steps[1]?(L==="en"?"within 7 days of the announcement":A.steps[1].when):"";
  $("help").innerHTML="<h2>"+esc(t("help"))+"</h2><p style='margin:0 0 6px'>"+esc(t("helpTxt",{w}))+"</p><p style='margin:0 0 6px'>"+(A&&A.formUrl?'<a href="'+esc(A.formUrl)+'" target="_blank" rel="noopener">'+esc(t("appealForm"))+"</a>":esc(t("appealTba")))+"</p><p class='sub' style='margin:0'>"+((REG.contact||[]).length?REG.contact.map(c=>esc(c)).join(" · "):esc(t("contactTba")))+"</p>";
  $("foot").textContent=t("foot",{t:D.term.label,u:D.updated});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openC(b.dataset.c));
  $("cp").onclick=async()=>{const u=location.origin+location.pathname+"?p="+P+"&e="+E.replace("/","-")+"&t="+K+(L==="en"?"&lang=en":"");try{await navigator.clipboard.writeText(u);$("cpm").textContent=t("copied");}catch(e){$("cpm").textContent=u;}};
}
function openC(code){const c=CRS.find(x=>x.code===code);if(!c)return;const sc=(REG.schedule||{})[c.code];
  const as=c.assess.filter(r=>!/^รวม/.test(r[0])).slice().sort((a,b)=>(parseInt(a[3])||0)-(parseInt(b[3])||0));
  $("dlgB").innerHTML="<h3>"+esc(c.codeFmt)+" "+esc(L==="en"&&c.nameEn?c.nameEn:c.nameTh)+"</h3><p class='sub' style='margin:0'>"+esc(L==="en"?c.nameTh:c.nameEn)+" · "+esc(c.credits)+"</p>"+
    "<p class='sub' style='margin:4px 0 0'>"+esc(t("groups"))+": "+esc((c.groups||[]).map(GRP).join(" · "))+" · "+esc(t("sched"))+": "+(sc?esc(sc):esc(t("tba")))+" · "+esc(t("cpre"))+": "+esc(c.prereq||"–")+"</p>"+
    "<h4>"+esc(t("cdesc"))+"</h4>"+(c.desc||[]).map(x=>"<p style='margin:0 0 6px'>"+esc(x)+"</p>").join("")+
    "<h4>"+esc(t("cclo"))+"</h4><ol>"+c.clo.map(x=>"<li>"+esc(x.clo.replace(/^CLO\d+\s*/,"").replace(/\s*\((Cognitive|Psychomotor|Affective)[^)]*\)\s*$/,""))+"</li>").join("")+"</ol>"+
    "<h4>"+esc(t("cas"))+'</h4><div class="tw"><table><thead><tr><th>'+esc(t("wk"))+"</th><th>"+esc(t("what"))+"</th><th>"+esc(t("wt"))+"</th></tr></thead><tbody>"+as.map(r=>"<tr><td>"+esc(r[3])+"</td><td>"+esc(r[1])+"</td><td>"+esc(String(r[4]).replace("ร้อยละ ",""))+"%</td></tr>").join("")+"</tbody></table></div>"+
    (L==="en"?"<p class='sub' style='margin-top:8px'>Course details are in Thai, as in the official course specification.</p>":"");
  $("dlg").classList.add("on");$("x").focus();}
function save(){store.set("p",P);store.set("e",E);store.set("t",K);}
$("x").onclick=()=>$("dlg").classList.remove("on");$("dlg").onclick=e=>{if(e.target.id==="dlg")$("dlg").classList.remove("on");};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("dlg").classList.remove("on");});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;store.set("lang",L);render();});
render();
})();
</script>
